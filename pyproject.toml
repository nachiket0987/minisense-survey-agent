[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minisense-survey-agent"
version = "0.1.0"
description = "MiniSense Survey Analysis Agent for the omniSense technical assessment"
requires-python = ">=3.11"
authors = [{name = "Nachiket Lohar"}]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["minisense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads or loads the actual embedding model"]
